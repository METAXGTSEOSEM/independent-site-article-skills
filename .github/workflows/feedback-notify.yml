name: Feedback notification

on:
  workflow_run:
    workflows: ["Feedback intake"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read
  discussions: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: feedback-delivery-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: feedback-event
          path: event-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Notify the owner and acknowledge new issues
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 trusted/.github/scripts/feedback.py notify --record event-data/feedback.json
